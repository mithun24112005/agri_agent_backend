
# ─────────────────────────────────────────────────────────────
# Smart Agriculture — PostgreSQL development infrastructure
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d postgres
#   docker compose down           # stops but keeps data
#   docker compose down -v        # DESTRUCTIVE: removes named volume
#
# Credentials come from environment variables or a root-level .env file.
# Do NOT commit .env or hardcode passwords here.
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: agri-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       postgres        # default db; init script creates the real ones

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: agri_pgdata
